version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directories:
      - /src/FordFuelAlert.Functions
      - /tests/FordFuelAlert.Tests
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch
